<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Университет успеха, славы и богатства{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="index.html">
        <span class="brand-mark">УУСБ</span>
        <span class="brand-name">Успеха, славы и богатсва<br>университет</span>
      </a>
      <nav class="site-nav">
        <a href="index.html" {% if active == 'home' %}class="active"{% endif %}>Главная</a>
        <a href="calendar.html" {% if active == 'calendar' %}class="active"{% endif %}>Календарь</a>
        <a href="schedule.html" {% if active == 'schedule' %}class="active"{% endif %}>Расписание</a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026, Университет успеха, славы и богатсва.</p>
    </div>
  </footer>

  <div id="ai-agent-root"></div>
  <script src="static/js/ai_agent.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
